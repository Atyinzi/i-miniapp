# Production is intentionally fail-closed: every secret must be supplied externally.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

app.auth.token-store=redis
app.person-data-key=${PERSON_DATA_KEY:}
app.verification.signing-key=${VERIFICATION_SIGNING_KEY:}
app.hotel.checkin-signing-key=${HOTEL_CHECKIN_SIGNING_KEY:}
app.gate.secret-encryption-key=${GATE_SECRET_ENCRYPTION_KEY:}
app.wechat.app-id=${WECHAT_APP_ID:}
app.wechat.app-secret=${WECHAT_APP_SECRET:}
app.wechat.code2-session-url=https://api.weixin.qq.com/sns/jscode2session

# Real payment and notification delivery stay disabled until company credentials/templates are present.
app.wechat-pay-v3.enabled=${WECHAT_PAY_V3_ENABLED:false}
app.notification.sending-enabled=${NOTIFICATION_SENDING_ENABLED:false}
app.notification.worker-enabled=${NOTIFICATION_WORKER_ENABLED:false}
app.notification.wechat-enabled=${NOTIFICATION_WECHAT_ENABLED:false}

spring.devtools.restart.enabled=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
