spring.application.name=iminiapp-backend
spring.config.import=optional:file:./application-local.properties
app.verification.signing-key=${VERIFICATION_SIGNING_KEY:local-only-change-me}
app.hotel.checkin-signing-key=${HOTEL_CHECKIN_SIGNING_KEY:local-only-hotel-checkin-key}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iminiapp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=7
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.auth.token-store=${AUTH_TOKEN_STORE:redis}
app.auth.token-ttl=${AUTH_TOKEN_TTL:8h}
app.admin-auth.max-failed-attempts=${ADMIN_MAX_FAILED_ATTEMPTS:5}
app.admin-auth.lock-duration=${ADMIN_LOCK_DURATION:15m}
app.admin-auth.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin-auth.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin-auth.bootstrap-display-name=${ADMIN_BOOTSTRAP_DISPLAY_NAME:系统管理员}
app.wechat.app-id=${WECHAT_APP_ID:}
app.wechat.app-secret=${WECHAT_APP_SECRET:}
app.wechat.code2-session-url=${WECHAT_CODE2_SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.window=${RATE_LIMIT_WINDOW:1m}
app.rate-limit.login-limit=${RATE_LIMIT_LOGIN:10}
app.rate-limit.create-order-limit=${RATE_LIMIT_CREATE_ORDER:20}
app.rate-limit.payment-limit=${RATE_LIMIT_PAYMENT:10}
app.rate-limit.refund-limit=${RATE_LIMIT_REFUND:10}
app.rate-limit.verification-limit=${RATE_LIMIT_VERIFICATION:30}
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
app.order.expiration-scan-ms=${ORDER_EXPIRATION_SCAN_MS:60000}
app.person-data-key=${PERSON_DATA_KEY:local-development-person-data-key}
app.gate.secret-encryption-key=${GATE_SECRET_ENCRYPTION_KEY:local-development-gate-secret-key}
app.wechat-pay-v3.enabled=${WECHAT_PAY_V3_ENABLED:false}
app.wechat-pay-v3.app-id=${WECHAT_PAY_V3_APP_ID:${WECHAT_APP_ID:}}
app.wechat-pay-v3.merchant-id=${WECHAT_PAY_V3_MERCHANT_ID:}
app.wechat-pay-v3.merchant-serial-number=${WECHAT_PAY_V3_MERCHANT_SERIAL_NUMBER:}
app.wechat-pay-v3.private-key-path=${WECHAT_PAY_V3_PRIVATE_KEY_PATH:}
app.wechat-pay-v3.api-v3-key=${WECHAT_PAY_V3_API_V3_KEY:}
app.wechat-pay-v3.platform-public-key-path=${WECHAT_PAY_V3_PLATFORM_PUBLIC_KEY_PATH:}
app.wechat-pay-v3.platform-key-id=${WECHAT_PAY_V3_PLATFORM_KEY_ID:}
app.wechat-pay-v3.payment-notify-url=${WECHAT_PAY_V3_PAYMENT_NOTIFY_URL:}
app.wechat-pay-v3.refund-notify-url=${WECHAT_PAY_V3_REFUND_NOTIFY_URL:}
app.wechat-pay-v3.base-url=${WECHAT_PAY_V3_BASE_URL:https://api.mch.weixin.qq.com}
app.wechat-pay-v3.connect-timeout=${WECHAT_PAY_V3_CONNECT_TIMEOUT:5s}
app.wechat-pay-v3.request-timeout=${WECHAT_PAY_V3_REQUEST_TIMEOUT:10s}
app.wechat-pay-v3.callback-tolerance=${WECHAT_PAY_V3_CALLBACK_TOLERANCE:5m}
app.notification.sending-enabled=${NOTIFICATION_SENDING_ENABLED:false}
app.notification.worker-enabled=${NOTIFICATION_WORKER_ENABLED:false}
app.notification.wechat-enabled=${NOTIFICATION_WECHAT_ENABLED:false}
app.notification.wechat-miniprogram-state=${APP_NOTIFICATION_WECHAT_MINIPROGRAM_STATE:formal}
app.notification.wechat-connect-timeout=${APP_NOTIFICATION_WECHAT_CONNECT_TIMEOUT:5s}
app.notification.wechat-read-timeout=${APP_NOTIFICATION_WECHAT_READ_TIMEOUT:10s}
app.notification.wechat-templates.ORDER_CREATED=${WECHAT_TEMPLATE_ORDER_CREATED:}
app.notification.wechat-templates.ORDER_PAID=${WECHAT_TEMPLATE_ORDER_PAID:}
app.notification.wechat-templates.ORDER_COMPLETED=${WECHAT_TEMPLATE_ORDER_COMPLETED:}
app.notification.wechat-templates.ORDER_REFUNDED=${WECHAT_TEMPLATE_ORDER_REFUNDED:}
app.notification.wechat-templates.ORDER_WAITING_DRIVER=${WECHAT_TEMPLATE_ORDER_WAITING_DRIVER:}
app.notification.wechat-templates.ORDER_ACCEPTED=${WECHAT_TEMPLATE_ORDER_ACCEPTED:}
app.notification.wechat-fields.ORDER_CREATED=${WECHAT_FIELDS_ORDER_CREATED:}
app.notification.wechat-fields.ORDER_PAID=${WECHAT_FIELDS_ORDER_PAID:}
app.notification.wechat-fields.ORDER_COMPLETED=${WECHAT_FIELDS_ORDER_COMPLETED:}
app.notification.wechat-fields.ORDER_REFUNDED=${WECHAT_FIELDS_ORDER_REFUNDED:}
app.notification.wechat-fields.ORDER_WAITING_DRIVER=${WECHAT_FIELDS_ORDER_WAITING_DRIVER:}
app.notification.wechat-fields.ORDER_ACCEPTED=${WECHAT_FIELDS_ORDER_ACCEPTED:}
app.notification.sms-templates.ORDER_CREATED=${SMS_TEMPLATE_ORDER_CREATED:}
app.notification.sms-templates.ORDER_PAID=${SMS_TEMPLATE_ORDER_PAID:}
app.notification.sms-templates.ORDER_COMPLETED=${SMS_TEMPLATE_ORDER_COMPLETED:}
app.notification.sms-templates.ORDER_REFUNDED=${SMS_TEMPLATE_ORDER_REFUNDED:}
app.notification.sms-templates.ORDER_WAITING_DRIVER=${SMS_TEMPLATE_ORDER_WAITING_DRIVER:}
app.notification.sms-templates.ORDER_ACCEPTED=${SMS_TEMPLATE_ORDER_ACCEPTED:}
app.wechat-pay-v3.refund-dispatch-interval=${WECHAT_PAY_V3_REFUND_DISPATCH_INTERVAL:60s}
