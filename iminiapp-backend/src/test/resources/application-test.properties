# Reproducible integration-test environment. Secrets may be overridden by env vars.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/iminiapp_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.data.redis.host=${TEST_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${TEST_REDIS_PORT:6379}
app.auth.token-store=redis
app.auth.token-ttl=8h
app.rate-limit.enabled=true
app.rate-limit.window=1m
app.rate-limit.login-limit=10
app.rate-limit.create-order-limit=20
app.rate-limit.payment-limit=10
app.rate-limit.refund-limit=10
app.rate-limit.verification-limit=30
app.verification.signing-key=${TEST_VERIFICATION_SIGNING_KEY:test-signing-key}
app.person-data-key=${TEST_PERSON_DATA_KEY:test-person-data-key}
app.refund.mock-callback-key=${TEST_REFUND_MOCK_CALLBACK_KEY:test-refund-callback-key}
server.port=${TEST_SERVER_PORT:0}
