name: Verify project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iminiapp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/iminiapp_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: iminiapp-backend/pom.xml
      - name: Unit and integration tests
        working-directory: iminiapp-backend
        run: sh ./mvnw -B -ntp -Pintegration-test verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            iminiapp-backend/target/surefire-reports
            iminiapp-backend/target/failsafe-reports

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: corepack enable
      - name: Build admin app
        working-directory: iminiapp-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

  mini-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run mini-program tests
        working-directory: iminiapp-miniprogram-import-v7
        run: |
          for file in tests/*.test.js; do
            node "$file"
          done
